<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening Rygg…</title>
  <script>
    // Immediately hand the shared-route link to the Rygg app. On Android an intent:// URL with the
    // package pinned opens the app directly (no App Links verification required) and, if the app
    // isn't installed, follows browser_fallback_url. On other platforms we just show the fallback
    // page, since there's no app to open.
    (function () {
      var host = window.location.host;
      var path = window.location.pathname; // "/s/<token>"
      var fallback = "https://" + host + "/";
      if (/android/i.test(navigator.userAgent)) {
        var intentUrl = "intent://" + host + path +
          "#Intent;scheme=https;package=com.example.rygg;" +
          "S.browser_fallback_url=" + encodeURIComponent(fallback) + ";end";
        window.location.replace(intentUrl);
      }
    })();
  </script>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f5f6f4; color: #1b1c19;
    }
    @media (prefers-color-scheme: dark) { body { background: #16130f; color: #eef0ea; } }
    .card { max-width: 24rem; padding: 2rem 1.5rem; text-align: center; }
    p { opacity: .75; line-height: 1.5; margin: 0; }
    a { color: #3f6b3f; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <p>Opening this route in Rygg… <a id="retry" href="#">Tap here</a> if it doesn't open.</p>
  </div>
  <script>
    // Manual retry re-fires the same redirect (e.g. after installing the app).
    document.getElementById('retry').addEventListener('click', function (e) {
      e.preventDefault();
      var host = window.location.host, path = window.location.pathname;
      window.location.replace(
        "intent://" + host + path + "#Intent;scheme=https;package=com.example.rygg;" +
        "S.browser_fallback_url=" + encodeURIComponent("https://" + host + "/") + ";end"
      );
    });
  </script>
</body>
</html>
