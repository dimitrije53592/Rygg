<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rygg</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f5f6f4; color: #1b1c19;
    }
    @media (prefers-color-scheme: dark) { body { background: #16130f; color: #eef0ea; } }
    .card { max-width: 28rem; padding: 2rem 1.5rem; text-align: center; }
    h1 { font-size: 1.6rem; margin: 0 0 .5rem; color: #3f6b3f; }
    p { opacity: .8; line-height: 1.5; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Rygg</h1>
    <p>Plan, record, and share your hikes and rides. Open a shared route link on your phone to save
       it to your library.</p>
  </div>
</body>
</html>
